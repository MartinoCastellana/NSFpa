[project]
name = "nsfpa-api"
version = "0.1.0"
description = "NSFpa — Not Safe for Public Administration pseudonymization API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "email-validator>=2.2,<3",
  "cryptography>=43,<45",
  "httpx>=0.27,<1",
  "openai>=1.50,<2",
  "celery[redis]>=5.4,<6",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<12",
  "pytesseract>=0.3.13,<1",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7"]
ml = ["presidio-analyzer>=2.2", "spacy>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
